name: Backend baseline and P02 identity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and Git rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify roadmap and phase gates
        run: ./planning/verify-roadmap.ps1
      - name: Verify Git rules
        run: ./planning/verify-git-workflow.ps1
      - name: Exercise phase gate rejection cases
        run: ./planning/test-phase-gates.ps1
      - name: Verify Docker smoke response parsing and rejection
        run: ./docker/test-smoke-contracts.ps1
      - name: Check whitespace in the commit
        run: |
          git show --format= --check HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Git diff whitespace check failed.' }

  backend:
    name: Restore, build, tests and format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      P02_SQL_CONTAINER: hawaleknow-p02-ci-sql-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned SDK
        id: sdk
        run: |
          echo "version=$(jq -r '.sdk.version' global.json)" >> "$GITHUB_OUTPUT"
          echo "DOTNET_INSTALL_DIR=$RUNNER_TEMP/dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Verify the selected SDK
        run: test "$(dotnet --version)" = "$(jq -r '.sdk.version' global.json)"
      - name: Restore the locked dependency graph
        run: |
          while IFS= read -r -d '' project; do
            test -f "${project%/*}/packages.lock.json"
          done < <(find backend/src backend/tests -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' -print0)
          dotnet restore backend/HawalekNow.slnx --locked-mode
      - name: Build
        run: dotnet build backend/HawalekNow.slnx --configuration Release --no-restore
      - name: Start isolated SQL Server for actual migrations and transaction tests
        run: |
          p02_sql_password="Ci9!$(openssl rand -hex 24)"
          echo "::add-mask::$p02_sql_password"
          p02_sql_image=$(sed -n 's/^FROM //p' docker/sql/Dockerfile | head -1)
          test -n "$p02_sql_image"
          docker run --detach --name "$P02_SQL_CONTAINER" \
            --label "io.hawaleknow.test-run=${{ github.run_id }}" \
            --env ACCEPT_EULA=Y --env MSSQL_PID=EnterpriseDeveloper \
            --env MSSQL_MEMORY_LIMIT_MB=2048 --env MSSQL_SA_PASSWORD="$p02_sql_password" \
            --publish 127.0.0.1::1433 "$p02_sql_image"
          p02_sql_port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "1433/tcp") 0).HostPort}}' "$P02_SQL_CONTAINER")
          p02_sql_connection="Server=127.0.0.1,$p02_sql_port;Database=master;User ID=sa;Password=$p02_sql_password;Encrypt=True;TrustServerCertificate=True;Connect Timeout=15"
          echo "::add-mask::$p02_sql_connection"
          echo "HAWALEKNOW_TEST_SQL=$p02_sql_connection" >> "$GITHUB_ENV"
          p02_sql_ready=false
          for attempt in $(seq 1 60); do
            if docker exec --env SQLCMDPASSWORD="$p02_sql_password" "$P02_SQL_CONTAINER" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 2 -Q 'SELECT 1' >/dev/null 2>&1; then
              p02_sql_ready=true
              break
            fi
            sleep 2
          done
          test "$p02_sql_ready" = true
      - name: Test with the normal parallelization settings
        run: dotnet test backend/HawalekNow.slnx --configuration Release --no-build --no-restore
      - name: Verify format without modifying files
        run: dotnet format backend/HawalekNow.slnx --verify-no-changes --no-restore
      - name: Remove only this run's SQL container
        if: always()
        run: |
          if docker inspect "$P02_SQL_CONTAINER" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{index .Config.Labels "io.hawaleknow.test-run"}}' "$P02_SQL_CONTAINER")" = "${{ github.run_id }}"
            docker rm --force "$P02_SQL_CONTAINER"
          fi

  docker:
    name: API and SQL image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the application image
        run: docker build --pull --tag hawaleknow/api:p01-ci --file backend/Dockerfile .
      - name: Verify application startup and environment gates in Docker
        shell: pwsh
        run: ./docker/smoke-api.ps1 -Image hawaleknow/api:p01-ci
      - name: Build the existing SQL Full Text image
        run: docker build --pull --platform linux/amd64 --tag hawaleknow/sql-fts:p01-ci docker/sql
